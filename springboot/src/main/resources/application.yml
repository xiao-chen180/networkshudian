server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shixun?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT配置
jwt:
  secret: bookstore_jwt_secret_key_example_1234567890
  expiration: 86400000
