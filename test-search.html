<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>搜索测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; }
    .test-container { padding: 20px; background: #f5f5f5; min-height: 100vh; }
    .test-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .search-row { display: flex; gap: 12px; }
    .search-row input {
      flex: 1; height: 48px; padding: 0 20px;
      border: 2px solid #d4c4a8; border-radius: 8px;
      font-size: 15px; color: #333; outline: none;
    }
    .search-row input:focus { border-color: #8b5a2b; }
    .search-row button {
      height: 48px; padding: 0 32px;
      background: linear-gradient(135deg, #8b5a2b, #a0522d);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h2 style="margin-bottom: 20px;">搜索功能测试</h2>

    <div class="test-box">
      <h3>测试1: 原生 input</h3>
      <div class="search-row">
        <input id="testInput1" type="text" placeholder="输入关键词..." />
        <button onclick="testSearch1()">搜索</button>
      </div>
      <div id="result1" class="result" style="display:none;"></div>
    </div>

    <div class="test-box">
      <h3>测试2: API 连接</h3>
      <button onclick="testAPI()" style="padding:10px 20px;background:#8b5a2b;color:white;border:none;border-radius:5px;cursor:pointer;">测试后端 API</button>
      <div id="result2" class="result" style="display:none;"></div>
    </div>

    <div class="test-box">
      <h3>测试3: 点击测试</h3>
      <input id="testInput3" type="text" placeholder="点击这里输入..." style="width:100%;height:40px;padding:0 15px;border:2px solid #ccc;border-radius:5px;font-size:14px;" />
      <div id="result3" class="result" style="display:none;"></div>
    </div>
  </div>

  <script>
    function testSearch1() {
      const input = document.getElementById('testInput1');
      const result = document.getElementById('result1');
      result.style.display = 'block';
      result.innerHTML = '✅ 搜索按钮点击成功！输入值: "' + input.value + '"';
    }

    async function testAPI() {
      const result = document.getElementById('result2');
      result.style.display = 'block';
      result.innerHTML = '正在测试 API...';

      try {
        const res = await fetch('http://localhost:8080/api/books?page=0&size=3');
        const data = await res.json();
        result.innerHTML = '✅ API 连接成功！<br>书籍数量: ' + data.totalElements + '<br>前3本: ' + data.content.map(b => b.name).join(', ');
      } catch (e) {
        result.innerHTML = '❌ API 连接失败: ' + e.message;
      }
    }

    document.getElementById('testInput3').addEventListener('input', function(e) {
      const result = document.getElementById('result3');
      result.style.display = 'block';
      result.innerHTML = '✅ 输入事件触发！当前值: "' + e.target.value + '"';
    });

    document.getElementById('testInput3').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        const result = document.getElementById('result3');
        result.innerHTML += '<br>✅ 回车键触发！';
      }
    });
  </script>
</body>
</html>
